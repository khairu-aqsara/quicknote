[package]
name = "quicknote"
version = "0.1.0"
description = "Type it. Close it. It's still there."
authors = ["QuickNote contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quicknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Clippy is what enforces Rust practice here, not review. `unwrap_used` and
# `expect_used` are the two that matter most: QuickNote holds the user's text,
# and a panic loses whatever has not reached the disk yet.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the WebView load local images the note references.
# `tray-icon` puts QuickNote in the system tray, and `image-png` lets
# `include_image!` compile the tray glyph into the binary.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
